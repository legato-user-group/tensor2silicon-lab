# GitHub Pages 무인 자동 배포 워크플로우 (VitePress 공식 권장 구성)
name: Deploy T2S WebBook to GitHub Pages

on:
  # main 브랜치에 push 될 때마다 자동 실행
  push:
    branches: [main]

  # GitHub Actions 탭에서 수동 실행 가능
  workflow_dispatch:

# GITHUB_TOKEN 권한 설정 (GitHub Pages 배포용)
permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포 충돌 방지
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 1. 빌드 잡
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: npm ci

      - name: Build with VitePress
        # GitHub Pages의 base_path (예: /tensor2silicon-lab/ 또는 커스텀 도메인일 경우 /)를 자동 감지하여 주입합니다!
        env:
          VITEPRESS_BASE: ${{ steps.pages.outputs.base_path }}/
        run: npm run docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  # 2. 배포 잡
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy to GitHub Pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
